<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Spact</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: #f7f6f2; color: #0b0f14;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 32rem; }
      .mark { display: block; width: 48px; height: 48px; }
      p.code { margin-top: 32px; font: 12px/16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #78716c; }
      h1 { margin-top: 8px; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
      p.body { margin-top: 16px; font-size: 16px; line-height: 24px; color: #57534e; text-wrap: pretty; }
      a.home {
        display: inline-block; margin-top: 32px; padding: 8px 12px; border-radius: 8px;
        background: #0b0f14; color: #f7f6f2; font-weight: 600; text-decoration: none;
        transition: background-color 300ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      a.home:hover { background: #292524; }
      a.home:focus-visible { outline: 2px solid #0b0f14; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0b0f14" />
        <rect x="7.5" y="8" width="3.5" height="16" rx="1.75" fill="#f7f6f2" />
        <rect x="21" y="8" width="3.5" height="16" rx="1.75" fill="#f7f6f2" />
        <circle cx="16" cy="16" r="3.25" fill="#f43f5e" />
      </svg>
      <p class="code">404</p>
      <h1>This page does not exist.</h1>
      <p class="body">The link may be old or mistyped. Nothing was paid, approved or blocked.</p>
      <a class="home" id="home" href="/">Back to Spact</a>
    </main>
    <script>
      // GitHub Pages serves this file for any missing path under /<repo>/, so home is that prefix there.
      if (location.hostname.endsWith(".github.io")) {
        const repo = location.pathname.split("/")[1];
        document.getElementById("home").href = repo ? `/${repo}/` : "/";
      }
    </script>
  </body>
</html>
