name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # unit results in machine-readable form, for the Security Lab report
      - run: |
          for p in shared web mcp notifier; do
            pnpm --filter "@spact/$p" exec vitest run --reporter=json --outputFile.json="$GITHUB_WORKSPACE/reports/vitest-$p.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-typescript
          path: reports/

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      # installs the toolchain and wasm target pinned in contracts/rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: |
          set -o pipefail
          mkdir -p ../reports
          rustc --version > ../reports/rustc-version.txt
          ../scripts/test-contracts.sh 2>&1 | tee ../reports/cargo.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-contracts
          path: reports/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: contracts
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spact/web exec playwright install --with-deps chromium
      # local sandbox chain + dev signer + approval page, driven by Chromium
      - run: pnpm e2e --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/reports/playwright.json
      # the agent's MCP server over stdio, against its own sandbox chain
      - run: pnpm mcp:sandbox --reporter=default --reporter=json --outputFile.json=${{ github.workspace }}/reports/vitest-mcp-sandbox.json
      # the Telegram notifier against its own sandbox chain and a mock Bot API
      - run: pnpm notifier:sandbox --reporter=default --reporter=json --outputFile.json=${{ github.workspace }}/reports/vitest-notifier-sandbox.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-e2e
          path: reports/
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/

  # Builds the Security Lab report from the raw output of the jobs above, even when one failed,
  # so failures show in it. It fails if any test the catalog names failed or did not run.
  security-report:
    needs: [typescript, contracts, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - run: pnpm --filter "@spact/security-lab..." build
      - run: node packages/security-lab/dist/cli.js reports security-report.json
        env:
          SPACT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: security-report.json

  # Publishes the web app to GitHub Pages from main, with the Security Lab report built above.
  # Runs only after every job passed. Until the repository variable VITE_VAULT_ID names a deployed
  # vault, the site is the Security Lab alone. Pages must be enabled with source "GitHub Actions".
  pages:
    needs: [typescript, contracts, e2e, security-report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
        id: pages
      - run: pnpm --filter @spact/web build
        env:
          VITE_NEAR_NETWORK: ${{ vars.VITE_NEAR_NETWORK || 'testnet' }}
          VITE_NEAR_RPC_URL: ${{ vars.VITE_NEAR_RPC_URL || 'https://test.rpc.fastnear.com' }}
          VITE_VAULT_ID: ${{ vars.VITE_VAULT_ID }}
          # absolute URLs for the share card, and the landing page's source link
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/download-artifact@v8
        with:
          name: security-report
          path: apps/web/dist
      - run: test -s apps/web/dist/security-report.json && test -s apps/web/dist/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
